workflows:
  ios-workflow:
    name: FallCare iOS Native Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Configure iOS Background Bluetooth
        script: |
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist 2>/dev/null || true
          grep -q "bluetooth-central" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" ios/Runner/Info.plist
          grep -q "NSBluetoothAlwaysUsageDescription" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'FallCare necesita Bluetooth en segundo plano para detectar caidas.'" ios/Runner/Info.plist
          grep -q "NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'FallCare usa la ubicacion para alertas de emergencia.'" ios/Runner/Info.plist
      - name: Build unsigned iOS IPA
        script: |
          set -e
          flutter build ios --release --no-codesign
          rm -rf Payload fallcare_app.ipa
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r fallcare_app.ipa Payload
          ls -lh fallcare_app.ipa
    artifacts:
      - fallcare_app.ipa
