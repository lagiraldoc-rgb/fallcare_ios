workflows:
  ios-workflow:
    name: FallCare iOS Native Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate iOS project and Background Permissions
        script: |
          flutter create --platforms=ios .
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string location" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string audio" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'FallCare necesita Bluetooth en segundo plano para detectar caidas.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'FallCare usa tu ubicacion para enviar alertas de emergencia.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'FallCare necesita tu ubicacion incluso con el telefono bloqueado.'" ios/Runner/Info.plist
          if [ -f "assets/alarma_caida.wav" ]; then
            cp assets/alarma_caida.wav ios/Runner/alarma_caida.wav
            ruby -e '
              require "xcodeproj"
              project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
              target = project.targets.first
              file_ref = project.main_group["Runner"].new_file("alarma_caida.wav")
              target.resources_build_phase.add_file_reference(file_ref)
              project.save
            '
          fi
      - name: Build unsigned iOS IPA
        script: |
          set -e
          flutter build ios --config-only --release --no-codesign
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" ios/Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" ios/Podfile
          sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target); target.build_configurations.each { |c| c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'; c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0' }/g" ios/Podfile
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          pod install --project-directory=ios
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios_xcode CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""
          rm -rf Payload fallcare_app.ipa
          mkdir -p Payload
          cp -r build/ios_xcode/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r fallcare_app.ipa Payload
          ls -lh fallcare_app.ipa
    artifacts:
      - fallcare_app.ipa
