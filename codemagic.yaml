workflows:
  ios-fallcare-native:
    name: FallCare iOS Native Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate iOS project with Background Bluetooth
        script: |
          flutter create --platforms=ios .
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'FallCare necesita Bluetooth para monitorear el sensor de caidas.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'FallCare necesita Bluetooth para recibir alertas de caida.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'FallCare usa tu ubicacion para mostrarla en caso de caida.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'FallCare usa tu ubicacion en caso de emergencia.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" ios/Runner/Info.plist
          flutter pub get
     - name: Build unsigned iOS IPA
        script: |
          set -e
          flutter build ios --release --no-codesign
          rm -rf Payload fallcare_app.ipa
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r fallcare_app.ipa Payload
    artifacts:
      - fallcare_app.ipa
